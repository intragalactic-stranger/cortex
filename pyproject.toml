# Virtual workspace root for the Cortex monorepo (no installable package here).
[tool.uv.workspace]
members = ["serve"]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.15",
    "ruff>=0.12",
    "pre-commit>=4",
    "types-PyYAML",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "TID"]

[tool.ruff.lint.per-file-ignores]
# published model-card prose: typographic × and − are intentional; long caveat sentences are content
"serve/scripts/hf_cards.py" = ["RUF001", "E501"]
"serve/src/cortex_serve/quantize/card.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["serve/src", "serve/tests"]

[[tool.mypy.overrides]]
# installed only in the M3 quantization image (pins conflict with vLLM's, docs/research M3 §1.4)
module = ["llmcompressor.*", "compressed_tensors.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["serve/tests"]
markers = ["network: needs internet access (skipped in CI)"]
addopts = "-m 'not network' -q"
