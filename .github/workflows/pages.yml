name: pages

# Builds the static site in web/ and publishes it to GitHub Pages at /cortex/.
on:
  push:
    branches: [main]
    paths: ["web/**", "serve/results/web/**", "serve/docs/DECISION_GUIDE.md", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (locked)
        working-directory: web
        run: npm ci
      - name: Build static export
        working-directory: web
        env:
          BASE_PATH: /cortex
        run: |
          npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
