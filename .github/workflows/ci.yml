name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --all-packages --locked
      - name: Lint
        run: |
          uv run ruff check serve
          uv run ruff format --check serve
      - name: Type check (strict)
        run: uv run mypy
      - name: Tests (offline)
        run: uv run pytest
      - name: memcalc smoke test
        run: make demo

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Parity vectors match the Python memcalc
        run: |
          uv sync --all-packages --locked
          uv run python serve/scripts/memcalc_web_vectors.py
          git diff --exit-code web/test/fixtures/memcalc_vectors.json
      - name: Install (locked)
        working-directory: web
        run: npm ci
      - name: Type check and tests
        working-directory: web
        run: |
          npm run typecheck
          npm test
      - name: Static build
        working-directory: web
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits to scan only those
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
