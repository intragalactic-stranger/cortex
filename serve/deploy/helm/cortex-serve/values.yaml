# cortex-serve chart values. Sized for a single-node k3d cluster on a 4 vCPU / 15 GiB VM (M5).
# Every image is pinned by digest; versions are recorded in serve/docs/VERSIONS.md.

llamacpp:
  # Same CPU llama-server image as M1 (build 12110, commit cd959bae9).
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:1145e8de3111dc9358c6d8daffb755c4cf8a862d93391c26ba521b9a810bbe3e
  # Backend API key: only the gateway and Prometheus hold it (Secret created by serve/deploy/k3d/up.sh).
  apiKeySecret: {name: backend-api-key, key: api-key}
  # Applied to every model unless the model overrides it.
  defaults:
    threads: 1
    parallel: 2           # slots per replica; also the autoscaling target per replica
    ctxPerSlot: 1024
    # Qwen3 thinking off (non-thinking chat); no bundled web UI on an inference backend.
    extraArgs: ["--reasoning", "off", "--no-ui"]
  probes:
    # startup: covers the slow weight load (mmap + warmup). 5 s x 60 = up to 5 min before liveness starts.
    startup: {periodSeconds: 5, failureThreshold: 60, timeoutSeconds: 3}
    # readiness: take a pod out of the Service quickly when /health stops answering 200.
    readiness: {periodSeconds: 5, failureThreshold: 2, timeoutSeconds: 3}
    # liveness: very tolerant. A busy CPU pod answers /health slowly; restarting it would only drop work.
    liveness: {periodSeconds: 20, failureThreshold: 6, timeoutSeconds: 10}
  # Graceful drain on scale-down / rollout: preStop waits until the pod has no running or queued
  # request (checked via /metrics), capped by terminationGracePeriodSeconds.
  drain:
    endpointGraceSeconds: 5
    terminationGracePeriodSeconds: 120
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001

# Weights come from a read-only hostPath cache exposed through a PV/PVC pair (never baked into images).
# On k3d the node path is a bind mount of the M1 GGUF directory (serve/deploy/k3d/cluster.yaml).
weights:
  hostPath: /var/lib/cortex/models
  storage: 20Gi

models:
  # Primary pool (v1). The only CPU config that met the M1 SLO at 1 user (RESULTS.md M1 table 2).
  - name: primary
    alias: qwen3-0.6b-q4km
    version: v1
    file: unsloth_Qwen3-0.6B-GGUF/Qwen3-0.6B-Q4_K_M.gguf
    hfRepo: unsloth/Qwen3-0.6B-GGUF
    hfRevision: 50968a4468ef4233ed78cd7c3de230dd1d61a56b
    replicas: 1
    resources:
      requests: {cpu: 500m, memory: 768Mi}
      limits: {cpu: "1", memory: 1536Mi}
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      pollingInterval: 5
      scaleDownStabilizationSeconds: 60
  # Canary (v2 candidate): same model at Q8_0. Gets gateway.canary.weight of cortex-default traffic.
  - name: canary
    alias: qwen3-0.6b-q8
    version: v2
    file: unsloth_Qwen3-0.6B-GGUF/Qwen3-0.6B-Q8_0.gguf
    hfRepo: unsloth/Qwen3-0.6B-GGUF
    hfRevision: 50968a4468ef4233ed78cd7c3de230dd1d61a56b
    enabled: true
    replicas: 1
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {cpu: "1", memory: 1536Mi}
  # D-021 fallback: a second, different self-hosted model in the same cluster (no external API).
  - name: fallback
    alias: qwen3-1.7b-q4km
    version: v1
    file: unsloth_Qwen3-1.7B-GGUF/Qwen3-1.7B-Q4_K_M.gguf
    hfRepo: unsloth/Qwen3-1.7B-GGUF
    hfRevision: d7f544eead698dbd1f15126ef60b45a1e1933222
    threads: 2
    replicas: 1
    resources:
      requests: {cpu: 250m, memory: 1280Mi}
      limits: {cpu: "2", memory: 2Gi}

gateway:
  image: ghcr.io/berriai/litellm-non_root:v1.108.16@sha256:9a81470454422473f10882f8de4c2c780bcd4a5719159c133110d437e1b8f7a7
  nodePort: 30400
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {cpu: "1", memory: 2Gi}
  secretName: litellm-secrets          # keys: master-key, salt-key (generated by up.sh)
  # Per-call limits to the backends.
  timeoutSeconds: 120                  # whole request
  streamTimeoutSeconds: 60             # max wait for the first streamed chunk
  numRetries: 2
  allowedFails: 2                      # failures per minute before a deployment is cooled down
  cooldownSeconds: 15
  # Requests-per-minute ceiling per backend deployment (LiteLLM rpm); keys get their own limits.
  backendRpm: 600
  canary:
    weight: 10                         # percent of cortex-default traffic sent to the canary (90/10)
  # Model aliases exposed to clients. "deployments" name entries of .Values.models.
  aliases:
    cortex-default: {deployments: [primary, canary], fallbacks: [cortex-fallback]}
    cortex-router: {deployments: [primary], fallbacks: [cortex-fallback]}
    cortex-judge: {deployments: [fallback], fallbacks: [cortex-default]}
    cortex-fallback: {deployments: [fallback]}
  # Direct handles used by the canary evaluation (not for application traffic).
  pinned:
    cortex-stable: primary
    cortex-candidate: canary
  # ---------------------------------------------------------------------------------------------
  # DISABLED SLOT: Modal vLLM GPU endpoint (G-13 / plan M5 task 3). Another session supplies the URL.
  # When enabled it is inserted into the fallback chain after the local pool:
  #   cortex-default -> cortex-gpu (Modal) -> cortex-fallback
  # Enabling it also opens gateway egress to 0.0.0.0/0:443. The token is read from the Secret below
  # (never put it in values). Not deployed or exercised in M5.
  modal:
    enabled: false
    apiBase: ""                        # e.g. https://<workspace>--<app>.modal.run/v1
    model: ""                          # served model name on the vLLM side
    apiKeySecret: {name: modal-endpoint, key: api-key}
  # ---------------------------------------------------------------------------------------------
  db:
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    passwordSecret: {name: gateway-db, key: password}
    storage: 1Gi
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

monitoring:
  # Namespace and pod labels of Prometheus, allowed through the model/gateway NetworkPolicies.
  prometheusNamespace: monitoring
  prometheusPodLabels: {app.kubernetes.io/name: prometheus}
  prometheusUrl: http://kps-prometheus.monitoring.svc:9090
  scrapeInterval: 5s
  dashboards: true
  # G-04 CPU SLO, used by the alert rules.
  slo:
    ttftP95Seconds: 3
  alerts:
    slotUsage: 0.95
    errorRate: 0.01
    forDuration: 5m

networkPolicies:
  enabled: true
