{{- $g := .Values.gateway -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cortex.gatewayName" . }}
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ $g.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cortex-serve
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: litellm
          image: {{ $g.image }}
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "1"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: {secretKeyRef: {name: {{ $g.secretName }}, key: master-key}}
            - name: LITELLM_SALT_KEY
              valueFrom: {secretKeyRef: {name: {{ $g.secretName }}, key: salt-key}}
            - name: BACKEND_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.llamacpp.apiKeySecret.name }}, key: {{ .Values.llamacpp.apiKeySecret.key }}}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $g.db.passwordSecret.name }}, key: {{ $g.db.passwordSecret.key }}}}
            - name: DATABASE_URL
              value: postgresql://litellm:$(DB_PASSWORD)@{{ include "cortex.dbName" . }}:5432/litellm
            {{- if $g.modal.enabled }}
            - name: MODAL_ENDPOINT_KEY
              valueFrom: {secretKeyRef: {name: {{ $g.modal.apiKeySecret.name }}, key: {{ $g.modal.apiKeySecret.key }}}}
            {{- end }}
            - {name: LITELLM_LOG, value: "INFO"}
            - {name: LITELLM_TELEMETRY, value: "False"}
            # No internet egress (NetworkPolicy): use the cost map bundled in the image.
            - {name: LITELLM_LOCAL_MODEL_COST_MAP, value: "True"}
            - {name: DISABLE_SCHEMA_UPDATE, value: "False"}
          ports:
            - {name: http, containerPort: 4000, protocol: TCP}
          startupProbe:
            httpGet: {path: /health/liveliness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/litellm, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ include "cortex.gatewayName" . }}-config}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cortex.gatewayName" . }}
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  # NodePort is published on 127.0.0.1 only by k3d (serve/deploy/k3d/cluster.yaml).
  type: NodePort
  selector:
    app.kubernetes.io/component: gateway
  ports:
    - {name: http, port: 4000, targetPort: http, nodePort: {{ $g.nodePort }}, protocol: TCP}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cortex.gatewayName" . }}
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
---
{{- /* Gateway state (virtual keys, budgets, spend). Single replica; local-path PVC on k3d. */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cortex.dbName" . }}
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-db
spec:
  serviceName: {{ include "cortex.dbName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway-db
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cortex-serve
        app.kubernetes.io/component: gateway-db
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70       # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ $g.db.image }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_USER, value: litellm}
            - {name: POSTGRES_DB, value: litellm}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $g.db.passwordSecret.name }}, key: {{ $g.db.passwordSecret.key }}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432, protocol: TCP}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "litellm", "-d", "litellm"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "litellm", "-d", "litellm"]}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml $g.db.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ $g.db.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cortex.dbName" . }}
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: gateway-db
  ports:
    - {name: postgres, port: 5432, targetPort: postgres, protocol: TCP}
