name: e1-l4-llamacpp
experiment: E1
description: Engine baseline on L4. Qwen3-4B-Instruct-2507 F16 GGUF (unsloth; same bytes as bf16), llama.cpp CUDA, 16 slots x 4096 ctx, concurrency 1-16 (smaller grid by design, owner-approved 2026-11-24).
engine:
  kind: llamacpp
  launch: process
  image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12110@sha256:a2963b4817f03eea7e0d6065ea576252322792441ef97aaae178b924520547d6
  args: {parallel: 16, ctx_size: 65536, flash_attn: "on", ignore_eos: true, extra: ["-ngl", "99"]}
artifacts:
  - {name: qwen3-4b-f16-gguf, repo: unsloth/Qwen3-4B-Instruct-2507-GGUF, revision: a06e946bb6b655725eafa393f4a9745d460374c9, file: Qwen3-4B-Instruct-2507-F16.gguf, family: Qwen/Qwen3-4B-Instruct-2507, quant: f16}
tokenizers:
  Qwen/Qwen3-4B-Instruct-2507: {repo: Qwen/Qwen3-4B-Instruct-2507, revision: cdbee75f17c01a7cc42f958dc650907174af0554}
workloads:
  - {name: chat-balanced, input_tokens: 512, output_tokens: 256}
  - {name: rag-long-prefill, input_tokens: 2048, output_tokens: 128}
load: {mode: concurrency, levels: [1, 4, 16], requests_per_level: 16, requests_per_slot: 3, warmup_requests: 4}
slo: {ttft_s: 0.5, tpot_s: 0.05}
repeats: 3
hardware: {device: modal-l4, gpu: L4}
budget: {gpu: L4, usd_per_hour: 0.80, max_minutes: 60}
