name: gpu-smoke-vllm-l4
experiment: smoke
description: First Modal run. Validates the image, engine startup, log parsing and GPU telemetry on the cheapest tier.
engine:
  kind: vllm
  launch: process
  image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
  args: {max_model_len: 4096, gpu_memory_utilization: 0.9}
artifacts:
  - {name: qwen3-0.6b-bf16, repo: Qwen/Qwen3-0.6B, revision: c1899de289a04d12100db370d81485cdf75e47ca, family: Qwen/Qwen3-0.6B, quant: bf16}
tokenizers:
  Qwen/Qwen3-0.6B: {repo: Qwen/Qwen3-0.6B, revision: c1899de289a04d12100db370d81485cdf75e47ca}
workloads:
  - {name: chat-short, input_tokens: 128, output_tokens: 64}
load: {mode: concurrency, levels: [1, 8], requests_per_level: 16, warmup_requests: 2}
slo: {ttft_s: 0.5, tpot_s: 0.05}
repeats: 1
# Verify the L4 rate on modal.com/pricing before running. 20-minute hard cap.
budget: {gpu: L4, usd_per_hour: 0.80, max_minutes: 20}
