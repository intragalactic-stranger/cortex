name: e1-l4-vllm
experiment: E1
description: Engine baseline on L4. Qwen3-4B-Instruct-2507 bf16, vLLM, chat-balanced + rag-long-prefill, concurrency 1-64, 3 repeats.
engine:
  kind: vllm
  launch: process
  image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
  args: {max_model_len: 4096, gpu_memory_utilization: 0.9}
artifacts:
  - {name: qwen3-4b-bf16, repo: Qwen/Qwen3-4B-Instruct-2507, revision: cdbee75f17c01a7cc42f958dc650907174af0554, family: Qwen/Qwen3-4B-Instruct-2507, quant: bf16}
tokenizers:
  Qwen/Qwen3-4B-Instruct-2507: {repo: Qwen/Qwen3-4B-Instruct-2507, revision: cdbee75f17c01a7cc42f958dc650907174af0554}
workloads:
  - {name: chat-balanced, input_tokens: 512, output_tokens: 256}
  - {name: rag-long-prefill, input_tokens: 2048, output_tokens: 128}
load: {mode: concurrency, levels: [1, 4, 16, 32, 64], requests_per_level: 16, requests_per_slot: 3, warmup_requests: 4}
slo: {ttft_s: 0.5, tpot_s: 0.05}
repeats: 3
hardware: {device: modal-l4, gpu: L4}
# L4 $0.80/h verified with `modal billing rates` 2026-11-24. Expected ~35 min; hard cap 60 min.
budget: {gpu: L4, usd_per_hour: 0.80, max_minutes: 60}
