artifacts:
- name: gemma4-e4b-bf16
  repo: google/gemma-4-E4B-it
  revision: 4ecc2ba63bcac23ba4a767fc87025b1450f84c9c
  family: google/gemma-4-E4B-it
  quant: bf16
tokenizers:
