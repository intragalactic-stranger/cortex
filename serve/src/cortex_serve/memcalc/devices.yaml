# Device table for memcalc. All values are APPROXIMATE and must be re-checked against vendor pages.
#   memory_gib    : memory usable by the process. For GPUs this is the total that nvidia-smi typically
#                   reports (slightly below the marketing number); confirmed per GPU in M2.
#   bandwidth_gbs : peak memory bandwidth, GB/s (1e9 bytes).
#   bf16_tflops / fp8_tflops : dense tensor-core peak (no sparsity); null = not supported / unknown.
# Sources: NVIDIA product pages / datasheets (URLs below), Apple tech specs. Checked 2026-11-05.

T4:
  kind: gpu
  memory_gib: 15.0
  bandwidth_gbs: 320
  bf16_tflops: null # Turing has no bf16; fp16 tensor ~65 TFLOPS
  fp8_tflops: null
  source_url: https://www.nvidia.com/en-us/data-center/tesla-t4/
