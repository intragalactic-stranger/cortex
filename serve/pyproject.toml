[project]
name = "cortex-serve"
version = "0.1.0"
description = "Cortex Serve: LLM inference memory calculator, benchmark harness, and production serving."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "typer>=0.15",
    "rich>=13",
    "pyyaml>=6",
    "httpx>=0.28",
]

[project.scripts]
memcalc = "cortex_serve.memcalc.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_serve"]
